# Copy to config.toml and edit

update_interval_minutes = 30
output_dir = "out"

# Location: either set auto_location=true, or provide lat/lon
auto_location = true

[network]
# If you are behind a corporate proxy, set these.
# Example: "http://proxy.mycorp.com:8080"
https_proxy = "http://child-prc.intel.com:913"
http_proxy = "http://child-prc.intel.com:913"
timeout_s = 30

# Keep only recent outputs (by day folder name). With keep_days=1, only today's images remain.
[retention]
keep_days = 1

[location]
name = "Shanghai"
lat = 31.2304
lon = 121.4737

[area]
half_width_km = 250
half_height_km = 140

[image]
width = 3840
height = 2160
format = "jpg"   # jpg or png
quality = 92

[region]
# Used when satellite.himawari_layout="fit" to fill the letterbox area.
globe_background_style = "gradient"  # solid | gradient
globe_background_rgb = [6, 16, 28]    # inner (near center)
globe_background_rgb2 = [0, 0, 6]     # outer (near corners)
globe_background_stars = true

[satellite]
provider = "himawari"  # gibs | himawari

# Himawari true-color full-disk (daytime)
himawari_product = "D531106"
himawari_band = ""  # D531106 has no band segment
himawari_level_d = 8
himawari_layout = "fit"  # keep full earth disk visible
himawari_max_lookback_minutes = 720

layers = [
  "VIIRS_SNPP_CorrectedReflectance_TrueColor",
  "MODIS_Terra_CorrectedReflectance_TrueColor",
]
max_days_back = 10

[wallpaper]
style = "fill"   # fill | fit | stretch | center | span

[overlay]
enabled = true
text_template = "{layer}  {date}  ({lat:.2f},{lon:.2f})"
position = "bottom-right"   # bottom-right | bottom-left | top-right | top-left
margin_px = 24
font_size_px = 28
fill_rgba = [255, 255, 255, 220]
stroke_rgba = [0, 0, 0, 180]
stroke_width_px = 3
