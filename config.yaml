# Copy to config.yaml and edit
#
# update_interval_minutes: Used by `run` loop OR Scheduled Task interval (recommended)
update_interval_minutes: 30

# Where to store images and logs
output_dir: "out"

# Keep only recent outputs (by day folder name). With keep_days: 1, only today's images remain.
retention:
  keep_days: 1

# Location: either set auto_location=true, or provide lat/lon
auto_location: true
location:
  name: "Shanghai"
  lat: 31.2304
  lon: 121.4737

# How much area to fetch around your location
# Note: larger area == more bandwidth
area:
  half_width_km: 250
  half_height_km: 140

# Image output
image:
  width: 3840
  height: 2160
  format: "jpg"  # jpg or png
  quality: 92

# Satellite layer source
# GIBS daily layers (try in order)
# - VIIRS_SNPP_CorrectedReflectance_TrueColor (often good and recent)
# - MODIS_Terra_CorrectedReflectance_TrueColor
satellite:
  layers:
    - "VIIRS_SNPP_CorrectedReflectance_TrueColor"
    - "MODIS_Terra_CorrectedReflectance_TrueColor"
  max_days_back: 10

# Wallpaper style: fill | fit | stretch | center | span
wallpaper:
  style: "fill"

# Optional: draw a small overlay text
overlay:
  enabled: true
  text_template: "{layer}  {date}  ({lat:.2f},{lon:.2f})"
  position: "bottom-right"  # bottom-right | bottom-left | top-right | top-left
  margin_px: 24
  font_size_px: 28
  fill_rgba: [255, 255, 255, 220]
  stroke_rgba: [0, 0, 0, 180]
  stroke_width_px: 3
