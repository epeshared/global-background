[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-background"
version = "0.1.0"
description = "Fetch near-real-time satellite imagery and set as Windows wallpaper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "global-background contributors" }]
dependencies = []

[project.optional-dependencies]
full = [
  "requests>=2.31",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.scripts]
global-background = "global_background.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
